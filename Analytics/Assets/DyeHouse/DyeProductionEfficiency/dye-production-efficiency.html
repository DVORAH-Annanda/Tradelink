<!DOCTYPE html>
<html><head><meta charset="utf-8"/><title>Dye Production Efficiency</title><style>{{ANALYTICS_CSS}}</style>
<style>
body{padding:0}.dye-dashboard{padding:18px 22px 30px}.dashboard-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.dashboard-title{font-size:24px;font-weight:600}.dashboard-period{font-size:13px;color:#605e5c}.tabs{display:flex;border-bottom:1px solid #ddd;margin-bottom:18px}.tab-button{border:0;background:transparent;padding:12px 18px;font-weight:600;color:#666;border-bottom:3px solid transparent;cursor:pointer}.tab-button.active{color:#222;border-bottom-color:#5b8def}.tab-page{display:none}.tab-page.active{display:block}.panel{background:#fff;padding:22px;border-radius:8px;box-shadow:0 2px 7px rgba(0,0,0,.10);margin-bottom:20px}.panel-title{font-size:18px;font-weight:600;margin-bottom:14px}.report-table{width:100%;border-collapse:collapse;font-size:14px}.report-table th{padding:10px 12px;border-bottom:2px solid #ddd;text-align:left}.report-table td{padding:9px 12px;border-bottom:1px solid #eee}.report-table .number{text-align:right}.report-table tfoot td{font-weight:600;border-top:2px solid #ccc}.chart-wrapper{height:460px}.bad{color:#c00000;font-weight:600}.table-scroll{overflow:auto;max-height:560px}
</style></head><body>
<div class="dye-dashboard"><div class="dashboard-header"><div class="dashboard-title">Dye Production Efficiency</div><div class="dashboard-period" id="period"></div></div>
<div class="tabs"><button class="tab-button active" data-tab="processTab">Process Loss</button><button class="tab-button" data-tab="diskTab">Disk Variance After Dye</button></div>
<div id="processTab" class="tab-page active"><div class="panel"><div class="panel-title">Process Loss % by Colour</div><div class="table-scroll"><table class="report-table"><thead><tr><th>Colour</th><th class="number">Gross Weight</th><th class="number">Nett Weight</th><th class="number">Process Loss %</th></tr></thead><tbody id="processBody"></tbody><tfoot id="processFoot"></tfoot></table></div></div><div class="panel"><div class="panel-title">Process Loss %</div><div class="chart-wrapper"><canvas id="processChart"></canvas></div></div></div>
<div id="diskTab" class="tab-page"><div class="panel"><div class="panel-title">Disk Variance by Greige Quality</div><div class="table-scroll"><table class="report-table"><thead><tr><th>Greige Quality</th><th class="number">Pieces</th><th class="number">Avg Standard Disk</th><th class="number">Avg Actual Disk</th><th class="number">Disk Variance %</th></tr></thead><tbody id="diskBody"></tbody></table></div></div><div class="panel"><div class="panel-title">Disk Variance After Dye</div><div class="chart-wrapper"><canvas id="diskChart"></canvas></div></div></div></div>
<script>window.dyeDashboardData={{DASHBOARD_DATA}};</script><script>{{CHART_JS}}</script><script>{{COLOUR_PALETTE_JS}}</script><script>{{PAGE_JS}}</script></body></html>
